server:
  port: ${CRM_PORT:5174}
  address: ${CRM_HOST:127.0.0.1}
  shutdown: graceful
  servlet:
    session:
      timeout: 10m
      cookie:
        name: EMIECRM_SESSION
        http-only: true
        same-site: lax
  tomcat:
    threads:
      max: 40
    max-http-form-post-size: 30MB
spring:
  application:
    name: emie-crm
  datasource:
    url: jdbc:mysql://${CRM_DB_HOST:127.0.0.1}:${CRM_DB_PORT:3306}/${CRM_DB_NAME:emiecrm}?tinyInt1isBit=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
    username: ${CRM_DB_USER:emiecrm}
    password: ${CRM_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      initialization-fail-timeout: 60000
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: UTC
  mvc:
    log-resolved-exception: false
logging:
  level:
    root: INFO
    com.lark.oapi.ws: OFF
