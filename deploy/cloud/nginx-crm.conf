server {
    listen 9002 ssl;
    server_name crm.emie.cn;
    ssl_certificate /opt/emiecrm/fullchain.pem;
    ssl_certificate_key /opt/emiecrm/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 30m;
    access_log /var/log/nginx/emiecrm-access.log;
    error_log /var/log/nginx/emiecrm-error.log;
    include /opt/emiecrm/nginx/jst/*.conf;
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 9002;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name crm.emie.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/emiecrm-acme;
    }
    location / {
        return 301 https://crm.emie.cn:9002$request_uri;
    }
}
