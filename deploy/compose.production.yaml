version: '3.8'
services:
  crm:
    image: emiecrm:java-production-amd64
    container_name: emiecrm
    ports:
      - '${CRM_LAN_IP:?Set CRM_LAN_IP}:8088:5174'
      - '127.0.0.1:8088:5174'
    environment:
      CRM_PASSWORD_LOGIN_ENABLED: '0'
      CRM_REQUIRE_LOGIN: ${CRM_REQUIRE_LOGIN:-1}
      CRM_FEISHU_LONG_CONNECTION: ${CRM_FEISHU_LONG_CONNECTION:-0}
      CRM_FEISHU_ENABLED: ${CRM_FEISHU_ENABLED:-0}
      CRM_FEISHU_APP_ID: ${CRM_FEISHU_APP_ID:-}
      CRM_FEISHU_APP_SECRET: ${CRM_FEISHU_APP_SECRET:-}
      CRM_FEISHU_REDIRECT_URI: ${CRM_FEISHU_REDIRECT_URI:-}
      CRM_DB_HOST: ${CRM_DB_HOST:?Set CRM_DB_HOST to the 1Panel MySQL container}
      CRM_DB_NAME: emiecrm
      CRM_DB_USER: emiecrm
      CRM_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    networks:
      - panel
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    init: true
networks:
  panel:
    external: true
    name: ${CRM_DOCKER_NETWORK:-1panel-network}
